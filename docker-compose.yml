services:
  postgres:
    image: postgres:16-alpine
    container_name: foodstock-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodstock-network

  api:
    build: .
    container_name: foodstock-api
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - foodstock-network

volumes:
  postgres_data:

networks:
  foodstock-network:
